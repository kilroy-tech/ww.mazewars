<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MazeWars+</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="classic">
    <main class="mac-window" aria-label="MazeWars+ application">
        <header class="title-bar">
            <div class="title-bars" aria-hidden="true"></div>
            <h1 class="title-text">MazeWars+</h1>
            <div class="title-bars" aria-hidden="true"></div>
            <span id="connection-badge" class="status-pill" role="status">Connecting...</span>
        </header>

        <!-- Lobby Screen -->
        <section id="lobby-screen" class="lobby" aria-label="Join game">
            <div class="lobby-card">
                <div class="eyeball-emblem" aria-hidden="true">
                    <svg viewBox="0 0 80 80" width="72" height="72">
                        <circle cx="40" cy="40" r="34" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="3"/>
                        <circle cx="40" cy="40" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/>
                        <circle cx="40" cy="40" r="7" fill="currentColor"/>
                        <circle cx="37" cy="37" r="2.5" fill="#fff"/>
                    </svg>
                </div>
                <h2>MAZE WARS+</h2>
                <p class="subtitle">Classic Macintosh First-Person Maze Combat</p>

                <form id="join-form" class="lobby-form">
                    <label for="username-input">Callsign
                        <input id="username-input" type="text" maxlength="16" placeholder="Eyeball" autocomplete="nickname" required>
                    </label>

                    <div class="lobby-options">
                        <label for="map-select">Maze
                            <select id="map-select"></select>
                        </label>
                        <label for="bot-select">AI Bots
                            <select id="bot-select">
                                <option value="0">0 Bots</option>
                                <option value="1">1 Bot</option>
                                <option value="2" selected>2 Bots</option>
                                <option value="3">3 Bots</option>
                                <option value="4">4 Bots</option>
                            </select>
                        </label>
                        <label for="theme-select">Display
                            <select id="theme-select">
                                <option value="classic" selected>Classic Mac</option>
                                <option value="green">Phosphor Green</option>
                                <option value="amber">Amber CRT</option>
                            </select>
                        </label>
                    </div>

                    <div class="lobby-actions">
                        <button id="join-btn" type="submit" disabled>Enter Maze</button>
                        <button id="solo-btn" type="button" class="secondary">Play Solo (Bots)</button>
                    </div>
                </form>

                <p id="lobby-status" class="status-line" role="status">Initializing Kilroy WebWidget SDK...</p>
                <p id="lobby-error" class="error-line" role="alert" hidden></p>

                <div class="controls-legend">
                    <strong>Controls:</strong>
                    <span><kbd>W</kbd>/<kbd>↑</kbd> Forward</span>
                    <span><kbd>S</kbd>/<kbd>↓</kbd> Back</span>
                    <span><kbd>A</kbd>/<kbd>D</kbd> or <kbd>←</kbd>/<kbd>→</kbd> Turn</span>
                    <span><kbd>Q</kbd>/<kbd>E</kbd> Strafe</span>
                    <span><kbd>Z</kbd>/<kbd>C</kbd> Peek</span>
                    <span><kbd>Space</kbd>/Click Fire</span>
                </div>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="game-layout" aria-label="Maze arena" hidden>
            <div class="hud-bar">
                <div class="hud-stats">
                    <span>Player: <strong id="hud-name"></strong></span>
                    <span>Frags: <strong id="hud-kills">0</strong></span>
                    <span>Deaths: <strong id="hud-deaths">0</strong></span>
                    <span>Best: <strong id="hud-best">0</strong></span>
                </div>
                <div class="hud-actions">
                    <button id="radar-btn" type="button" class="mini-btn" title="Toggle radar visibility (R)">Radar: All</button>
                    <button id="sound-btn" type="button" class="mini-btn" title="Toggle sound (M)">Sound: On</button>
                    <button id="theme-btn" type="button" class="mini-btn" title="Cycle display theme">Theme</button>
                    <button id="leave-btn" type="button" class="mini-btn">Leave</button>
                </div>
            </div>

            <div class="arena-grid">
                <div class="viewport-pane">
                    <div class="canvas-frame" id="fps-frame">
                        <canvas id="fps-canvas" width="640" height="440" tabindex="0" aria-label="First-person 3D maze view"></canvas>
                        <div id="kill-feed" class="kill-feed" aria-live="polite"></div>
                    </div>
                    <div class="touch-controls" aria-label="On-screen movement and fire controls">
                        <div class="dpad">
                            <button type="button" class="ctrl-btn" data-action="peek-left" title="Peek Left (Z)">Peek L</button>
                            <button type="button" class="ctrl-btn" data-action="forward" title="Forward (W)">▲</button>
                            <button type="button" class="ctrl-btn" data-action="peek-right" title="Peek Right (C)">Peek R</button>
                            <button type="button" class="ctrl-btn" data-action="turn-left" title="Turn Left (A)">◀</button>
                            <button type="button" class="ctrl-btn" data-action="backward" title="Backward (S)">▼</button>
                            <button type="button" class="ctrl-btn" data-action="turn-right" title="Turn Right (D)">▶</button>
                        </div>
                        <div class="strafe-fire">
                            <div class="strafe-row">
                                <button type="button" class="ctrl-btn" data-action="strafe-left" title="Strafe Left (Q)">Step L</button>
                                <button type="button" class="ctrl-btn" data-action="strafe-right" title="Strafe Right (E)">Step R</button>
                            </div>
                            <button type="button" class="ctrl-btn fire-btn" data-action="fire" title="Fire Laser (Space)">FIRE</button>
                        </div>
                    </div>
                </div>

                <aside class="side-pane">
                    <div class="panel">
                        <div class="panel-header">
                            <span>2-D Maze Map</span>
                            <span id="map-label" class="muted"></span>
                        </div>
                        <canvas id="map-canvas" width="240" height="240" aria-label="2D top-down maze map"></canvas>
                    </div>

                    <div class="panel scoreboard-panel">
                        <div class="panel-header">
                            <span>Scoreboard</span>
                            <span id="player-count" class="muted">1 active</span>
                        </div>
                        <ul id="scoreboard-list" class="scoreboard-list"></ul>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <script type="module" src="./game.js"></script>
</body>
</html>
